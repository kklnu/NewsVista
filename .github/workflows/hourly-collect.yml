# Hourly collection, independent of app usage. GitHub runs scheduled workflows on
# a best-effort basis (often a few minutes late; may be skipped under load), so
# every run is also recorded server-side in collection_runs (see GET /status).
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   NEWSVISTA_API_URL   e.g. https://newsvista-api.onrender.com   (no trailing slash)
#   NEWSVISTA_ADMIN_TOKEN  same value as ADMIN_TOKEN on Render
name: Hourly news collection

on:
  schedule:
    - cron: "7 * * * *"   # minute 7 of every hour (UTC); avoids the busy top of the hour
  workflow_dispatch:
    inputs:
      max_ai:
        description: "Max AI generations this run (blank = server default)"
        required: false
        default: ""

concurrency:
  group: newsvista-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wake the API (free Render instances sleep when idle)
        env:
          API: ${{ secrets.NEWSVISTA_API_URL }}
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 60 "$API/health"; then echo; exit 0; fi
            echo "API not ready (attempt $i); retrying in 20s"; sleep 20
          done
          echo "API did not become healthy"; exit 1

      - name: Trigger protected collection
        env:
          API: ${{ secrets.NEWSVISTA_API_URL }}
          TOKEN: ${{ secrets.NEWSVISTA_ADMIN_TOKEN }}
          TRIGGER: ${{ github.event_name }}
          MAX_AI: ${{ github.event.inputs.max_ai }}
        run: |
          URL="$API/admin/collect"
          if [ -n "$MAX_AI" ]; then URL="$URL?max_ai=$MAX_AI"; fi
          HTTP=$(curl -sS -o result.json -w "%{http_code}" --max-time 900 -X POST \
            -H "Authorization: Bearer $TOKEN" -H "X-Trigger: $TRIGGER" "$URL")
          echo "HTTP $HTTP"
          python3 -c "import json;d=json.load(open('result.json'));[print(f'{k}: {v}') for k,v in d.items() if k!='sources'];[print(' ', s['source_id'], s['status'], 'new', s.get('new'), s.get('error') or '') for s in d.get('sources',[])]" || cat result.json
          test "$HTTP" = "200"
